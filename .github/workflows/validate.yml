name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or newer is required.' }
          Write-Host "Validation PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          $runtimeLock = Get-Content ./runtime-packages.lock.json -Raw | ConvertFrom-Json
          $testPackages = @($runtimeLock.packages | Where-Object name -eq 'Microsoft.Graph.Authentication')
          if ($testPackages.Count -ne 1) { throw 'Exactly one locked Graph authentication package is required for setup-session tests.' }
          $testLock = Join-Path $env:RUNNER_TEMP 'maester-setup-test-packages.lock.json'
          @{ schemaVersion = 1; packages = $testPackages } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $testLock -Encoding utf8
          $testModules = Join-Path $env:RUNNER_TEMP 'maester-setup-test-modules'
          ./scripts/Install-LockedModules.ps1 -LockPath $testLock -DestinationRoot $testModules
          "PSModulePath=$testModules$([IO.Path]::PathSeparator)$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run repository tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Write-Host "Validation Pester: $((Get-Module Pester).Version)"
          Invoke-Pester -Path ./tests -CI
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
